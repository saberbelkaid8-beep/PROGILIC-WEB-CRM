type User @table {
  email: String!
  createdAt: Timestamp!
  displayName: String
  avatarUrl: String
}

type Project @table {
  name: String!
  owner: User!
  colorCode: String
  description: String
}

type Task @table {
  title: String!
  status: String!
  priority: Int!
  owner: User!
  dueDate: Timestamp
  description: String
  project: Project
}

type VoiceNote @table {
  audioUrl: String!
  status: String!
  owner: User!
  transcript: String
  processedTask: Task
}

type Category @table {
  name: String!
  owner: User!
  icon: String
}